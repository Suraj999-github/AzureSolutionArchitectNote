<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>StoryCast – Input → Cinema</title>
    <style>
        /* ── Reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Georgia', 'Times New Roman', serif;
            touch-action: none;
        }

        /* ─── INPUT VIEW ─── */
        .input-view {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 20% 50%, #1a0a2e, #0a0a0f 70%);
            padding: 20px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .input-view.hidden {
            opacity: 0;
            transform: scale(0.96);
            pointer-events: none;
        }

        .input-card {
            width: 100%;
            max-width: 600px;
            background: rgba(16, 16, 24, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 36px 36px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .input-card .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .input-card .logo h1 {
            color: #f0f0f0;
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.5px;
            font-family: 'Segoe UI', sans-serif;
        }

        .input-card .logo h1 span {
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .input-card .logo p {
            color: #666;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .input-card textarea {
            width: 100%;
            background: #0e0e14;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 16px 18px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: 'Segoe UI', monospace;
            resize: vertical;
            min-height: 140px;
            max-height: 240px;
            transition: border-color 0.3s, box-shadow 0.3s;
            line-height: 1.7;
            outline: none;
            margin-bottom: 20px;
        }

        .input-card textarea:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.12);
        }

        .input-card textarea::placeholder {
            color: #555;
        }

        .input-card .input-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }

        .input-card .input-controls button {
            background: #28283a;
            border: 1px solid #3a3a4e;
            border-radius: 40px;
            padding: 12px 28px;
            color: #eee;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, border-color 0.2s;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
            touch-action: manipulation;
        }

        .input-card .input-controls button:hover {
            background: #3a3a52;
            border-color: #5a5a7a;
        }

        .input-card .input-controls button:active {
            transform: scale(0.96);
        }

        .input-card .input-controls .btn-play {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: #fff;
            padding: 12px 48px;
            font-size: 16px;
        }

        .input-card .input-controls .btn-play:hover {
            background: #7c6df0;
            border-color: #7c6df0;
        }

        .input-card .input-controls .btn-play:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-card .input-controls .btn-speed {
            background: transparent;
            border-color: #2a2a3a;
            color: #888;
            font-size: 13px;
            padding: 12px 18px;
        }

        .input-card .input-controls .btn-speed:hover {
            background: #1a1a2a;
            border-color: #4a4a5a;
            color: #ccc;
        }

        .input-card .input-hint {
            color: #444;
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            margin-top: 16px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* ─── FULL‑SCREEN CINEMA ─── */
        .cinema-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #060608;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .cinema-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cinema-modal .modal-screen {
            width: 100%;
            height: 100%;
            background: #060608;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cinema-modal .screen-content {
            width: 100%;
            height: 100%;
            padding: 60px clamp(20px, 8vw, 100px);
            position: relative;
            overflow: hidden;
        }

        /* ── Background orbs ── */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            pointer-events: none;
            animation: orbFloat 16s ease-in-out infinite alternate;
        }
        .bg-orb-1 {
            width: 600px;
            height: 600px;
            background: #6c2bd9;
            top: -200px;
            left: -150px;
            animation-delay: 0s;
        }
        .bg-orb-2 {
            width: 500px;
            height: 500px;
            background: #d94b8c;
            bottom: -200px;
            right: -150px;
            animation-delay: 6s;
        }
        .bg-orb-3 {
            width: 300px;
            height: 300px;
            background: #2b9bd9;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 12s;
            opacity: 0.2;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, 30px) scale(1.3);
            }
        }

        .film-grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        /* ── Lines ── */
        .line-item {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: clamp(28px, 5.5vw, 72px);
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.3;
            padding: 6px 16px;
            border-radius: 6px;
            text-shadow: 0 2px 50px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            pointer-events: none;
            will-change: transform, opacity;
            width: auto;
            max-width: 88%;
            opacity: 0;
            transition: none;
        }

        .line-item.empty-line {
            opacity: 0.12 !important;
            font-size: 0.7em;
            color: #555 !important;
            text-shadow: none !important;
        }

        /* ── "The End" ── */
        .the-end {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: rgba(255, 255, 255, 0.15);
            font-family: 'Georgia', serif;
            font-size: clamp(32px, 6vw, 80px);
            font-weight: 300;
            letter-spacing: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.05);
        }
        .the-end.show {
            opacity: 1;
        }
        .the-end small {
            font-size: 0.3em;
            letter-spacing: 3px;
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.06);
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
        }

        /* ── Status ── */
        .status-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            color: rgba(255, 255, 255, 0.08);
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .status-overlay.show {
            opacity: 1;
        }

        /* ── Close button (cinema) ── */
        .cinema-close {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 40;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
            touch-action: manipulation;
            opacity: 0;
            pointer-events: none;
        }
        .cinema-modal.open .cinema-close {
            opacity: 1;
            pointer-events: auto;
        }
        .cinema-close:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
        }
        .cinema-close:active {
            transform: scale(0.92);
        }

        /* ── Responsive ── */
        @media (max-width: 700px) {
            .input-card {
                padding: 30px 24px 28px;
            }
            .input-card .logo h1 {
                font-size: 24px;
            }
            .input-card textarea {
                font-size: 14px;
                min-height: 120px;
                padding: 14px 16px;
            }
            .input-card .input-controls button {
                padding: 10px 20px;
                font-size: 13px;
            }
            .input-card .input-controls .btn-play {
                padding: 10px 32px;
                font-size: 15px;
            }
            .cinema-modal .screen-content {
                padding: 40px clamp(16px, 4vw, 30px);
            }
            .line-item {
                font-size: clamp(22px, 5vw, 38px);
                max-width: 92%;
                padding: 4px 10px;
            }
            .bg-orb-1 {
                width: 350px;
                height: 350px;
                top: -120px;
                left: -100px;
            }
            .bg-orb-2 {
                width: 280px;
                height: 280px;
                bottom: -120px;
                right: -100px;
            }
            .bg-orb-3 {
                width: 180px;
                height: 180px;
            }
            .the-end {
                font-size: clamp(24px, 5vw, 48px);
            }
            .cinema-close {
                top: 16px;
                right: 16px;
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .input-card {
                padding: 24px 18px 22px;
                border-radius: 24px;
            }
            .input-card .logo h1 {
                font-size: 20px;
            }
            .input-card textarea {
                font-size: 13px;
                min-height: 100px;
                padding: 12px 14px;
            }
            .input-card .input-controls {
                flex-wrap: wrap;
            }
            .input-card .input-controls button {
                padding: 8px 16px;
                font-size: 12px;
                flex: 1 1 40%;
                justify-content: center;
            }
            .input-card .input-controls .btn-play {
                padding: 8px 24px;
                font-size: 14px;
                flex: 1 1 60%;
            }
            .cinema-modal .screen-content {
                padding: 30px clamp(12px, 3vw, 20px);
            }
            .line-item {
                font-size: clamp(18px, 4.5vw, 28px);
                max-width: 94%;
                padding: 3px 6px;
            }
            .bg-orb-1 {
                width: 220px;
                height: 220px;
                top: -80px;
                left: -60px;
            }
            .bg-orb-2 {
                width: 180px;
                height: 180px;
                bottom: -80px;
                right: -60px;
            }
            .bg-orb-3 {
                width: 120px;
                height: 120px;
            }
            .the-end {
                font-size: clamp(18px, 4vw, 32px);
                letter-spacing: 4px;
            }
            .the-end small {
                font-size: 0.25em;
                margin-top: 10px;
            }
            .status-overlay {
			    display:none;
                font-size: 9px;
                bottom: 16px;
            }
            .cinema-close {
                top: 12px;
                right: 12px;
                width: 34px;
                height: 34px;
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {
            .line-item {
                font-size: clamp(15px, 4vw, 20px);
                max-width: 96%;
                padding: 1px 2px;
            }
            .cinema-modal .screen-content {
                padding: 20px clamp(8px, 2vw, 12px);
            }
            .input-card {
                padding: 18px 14px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── INPUT VIEW ─── -->
    <div class="input-view" id="inputView">
        <div class="input-card">
            <div class="logo">
                <h1>✦ <span>StoryCast</span></h1>
                <p>type your story · watch it unfold</p>
            </div>
            <textarea id="textInput" rows="6">I thought my love for her was
a while(true) loop.
I forgot that
even the strongest loops...
can face
a break; statement
if they consume
too much memory.</textarea>
            <div class="input-controls">
                <button class="btn-speed" id="speedBtn">1×</button>
                <button class="btn-play" id="playBtn">▶ Play</button>
            </div>
            <div class="input-hint">Credits will auto‑close when finished</div>
        </div>
    </div>

    <!-- ─── FULL‑SCREEN CINEMA ─── -->
    <div class="cinema-modal" id="cinemaModal">
        <div class="modal-screen" id="modalScreen">
            <div class="bg-orb bg-orb-1"></div>
            <div class="bg-orb bg-orb-2"></div>
            <div class="bg-orb bg-orb-3"></div>
            <div class="film-grain"></div>
            <div class="screen-content" id="modalContent"></div>
            <div class="the-end" id="theEnd">✦ The End ✦<small>storycast</small></div>
            <div class="status-overlay" id="statusOverlay">● rolling</div>
            <button class="cinema-close" id="cinemaClose" aria-label="Close cinema">✕</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const inputView = document.getElementById('inputView');
            const textInput = document.getElementById('textInput');
            const playBtn = document.getElementById('playBtn');
            const speedBtn = document.getElementById('speedBtn');
            const cinemaModal = document.getElementById('cinemaModal');
            const modalContent = document.getElementById('modalContent');
            const theEnd = document.getElementById('theEnd');
            const statusOverlay = document.getElementById('statusOverlay');
            const cinemaClose = document.getElementById('cinemaClose');

            let isPlaying = false;
            let speedMultiplier = 1;
            const speedOptions = [0.5, 1, 1.5, 2];
            const LINE_SPACING = 85;

            const palette = [
                '#FF6B6B', '#FF9F43', '#FECA57', '#48DBFB', '#FF9FF3',
                '#54A0FF', '#5F27CD', '#00D2D3', '#A29BFE', '#FD79A8',
                '#FDCB6E', '#00CEC9', '#6C5CE7', '#E17055', '#00B894',
                '#F368E0', '#4BC0C0', '#FFC048', '#FF6B81', '#7C5CFC'
            ];

            // ── Get lines ──
            function getLines() {
                const raw = textInput.value;
                if (!raw || raw.trim().length === 0) return [];
                return raw.split('\n');
            }

            // ── Close cinema ──
            function closeCinema() {
                cinemaModal.classList.remove('open');
                inputView.classList.remove('hidden');
                if (modalContent._cleanup) {
                    modalContent._cleanup();
                    modalContent._cleanup = null;
                }
                if (modalContent._animId) {
                    cancelAnimationFrame(modalContent._animId);
                    modalContent._animId = null;
                }
                isPlaying = false;
                playBtn.textContent = '▶ Play';
                playBtn.disabled = false;
            }

            // ── Run credits ──
            function runCredits(lines, speed, onComplete) {
                const container = modalContent;
                if (!container) return null;

                container.innerHTML = '';
                theEnd.classList.remove('show');
                statusOverlay.textContent = '● rolling';
                statusOverlay.classList.add('show');

                const containerHeight = container.clientHeight || 600;
                const fadeZone = 80;
                let activeLines = [];
                let lineIndex = 0;
                let lastFrameTime = 0;
                let cancelled = false;

                function createLineElement(text, index) {
                    const div = document.createElement('div');
                    div.className = 'line-item';
                    const isEmpty = text.trim() === '' && text === '';
                    if (isEmpty) {
                        div.textContent = '\u00A0';
                        div.classList.add('empty-line');
                    } else {
                        div.textContent = text;
                        const colorIdx = index % palette.length;
                        const color = palette[colorIdx];
                        div.style.color = color;
                        div.style.textShadow =
                            `0 0 60px ${color}33, 0 0 120px ${color}11, 0 2px 30px rgba(0,0,0,0.6)`;
                    }
                    div.style.top = containerHeight + 'px';
                    div.style.opacity = '0';
                    container.appendChild(div);
                    return div;
                }

                function spawnLine() {
                    if (lineIndex >= lines.length || cancelled) return;
                    const text = lines[lineIndex];
                    const el = createLineElement(text, lineIndex);
                    activeLines.push({
                        element: el,
                        y: containerHeight,
                        text: text,
                        index: lineIndex,
                        isEmpty: text.trim() === '' && text === ''
                    });
                    lineIndex++;
                }

                spawnLine();

                function animate(timestamp) {
                    if (cancelled) {
                        activeLines.forEach(l => {
                            if (l.element.parentNode) l.element.remove();
                        });
                        activeLines = [];
                        return;
                    }

                    if (lastFrameTime === 0) lastFrameTime = timestamp;
                    const delta = Math.min((timestamp - lastFrameTime) / 16, 3);
                    lastFrameTime = timestamp;

                    const moveDistance = speed * delta;

                    const toRemove = [];
                    for (let i = activeLines.length - 1; i >= 0; i--) {
                        const line = activeLines[i];
                        line.y -= moveDistance;
                        const el = line.element;
                        const top = line.y;

                        const bottomFade = Math.min(1, (containerHeight - top) / fadeZone);
                        const topFade = Math.min(1, (top + 30) / fadeZone);
                        let opacity = Math.min(bottomFade, topFade);
                        opacity = Math.max(0, Math.min(1, opacity));
                        if (line.isEmpty) opacity = Math.min(opacity, 0.12);

                        el.style.top = top + 'px';
                        el.style.opacity = opacity;

                        if (top < -60) toRemove.push(i);
                    }

                    for (const idx of toRemove) {
                        const line = activeLines[idx];
                        if (line.element.parentNode) line.element.remove();
                        activeLines.splice(idx, 1);
                    }

                    if (lineIndex < lines.length) {
                        const lastLine = activeLines.length > 0 ? activeLines[activeLines.length - 1] : null;
                        const lastY = lastLine ? lastLine.y : containerHeight + 100;
                        if (lastY < containerHeight - LINE_SPACING) {
                            spawnLine();
                        }
                    }

                    const allSpawned = lineIndex >= lines.length;
                    const noLinesLeft = activeLines.length === 0;

                    if (allSpawned && noLinesLeft) {
                        statusOverlay.textContent = '● complete';
                        setTimeout(() => statusOverlay.classList.remove('show'), 800);
                        setTimeout(() => theEnd.classList.add('show'), 400);
                        if (onComplete) onComplete();
                        return;
                    }

                    if (!cancelled) {
                        const id = requestAnimationFrame(animate);
                        container._animId = id;
                    }
                }

                const animId = requestAnimationFrame(animate);
                container._animId = animId;

                return function cleanup() {
                    cancelled = true;
                    if (container._animId) {
                        cancelAnimationFrame(container._animId);
                        container._animId = null;
                    }
                    activeLines.forEach(l => {
                        if (l.element.parentNode) l.element.remove();
                    });
                    activeLines = [];
                };
            }

            // ── Start cinema ──
            function startCinema() {
                const lines = getLines();
                if (lines.length === 0) {
                    textInput.focus();
                    return;
                }
                const hasContent = lines.some(l => l.trim().length > 0);
                if (!hasContent) {
                    textInput.focus();
                    return;
                }

                // Close if already open
                if (modalContent._cleanup) {
                    modalContent._cleanup();
                    modalContent._cleanup = null;
                }
                if (modalContent._animId) {
                    cancelAnimationFrame(modalContent._animId);
                    modalContent._animId = null;
                }

                // Hide input, show cinema
                inputView.classList.add('hidden');
                cinemaModal.classList.add('open');

                isPlaying = true;
                playBtn.textContent = '⏳ Playing...';
                playBtn.disabled = true;
                theEnd.classList.remove('show');

                const cinemaSpeed = 0.4 * speedMultiplier;

                const cleanup = runCredits(lines, cinemaSpeed, () => {
                    // Auto-close after a short delay to show "The End"
                    setTimeout(() => {
                        closeCinema();
                    }, 1800);
                });

                modalContent._cleanup = cleanup;
            }

            // ── Speed toggle ──
            function cycleSpeed() {
                const currentIdx = speedOptions.indexOf(speedMultiplier);
                const nextIdx = (currentIdx + 1) % speedOptions.length;
                speedMultiplier = speedOptions[nextIdx];
                speedBtn.textContent = speedMultiplier + '×';
            }

            // ── Events ──
            playBtn.addEventListener('click', startCinema);

            speedBtn.addEventListener('click', cycleSpeed);

            cinemaClose.addEventListener('click', closeCinema);

            // Keyboard shortcut: Ctrl+Enter to play
            textInput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    startCinema();
                }
            });

            // Escape to close cinema
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && cinemaModal.classList.contains('open')) {
                    closeCinema();
                }
            });

            // ── Init ──
            console.log('🎬 StoryCast ready — input first, then cinema!');
        })();
    </script>

</body>
</html>
