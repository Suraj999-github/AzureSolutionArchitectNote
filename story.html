<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>StoryCast – Responsive Film Credits</title>
    <style>
        /* ── Reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            background: radial-gradient(ellipse at 20% 50%, #1a0a2e, #0a0a0f 70%);
            overflow-x: hidden;
        }

        /* ── Main app container ── */
        .app {
            width: 100%;
            max-width: 820px;
            background: rgba(16, 16, 24, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 24px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header h1 {
            color: #f0f0f0;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Segoe UI', sans-serif;
        }

        .header h1 span {
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .badge {
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
            font-size: 10px;
            padding: 4px 12px;
            border-radius: 40px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* ── Input area ── */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .input-area textarea {
            width: 100%;
            background: #0e0e14;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 14px 18px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: 'Segoe UI', monospace;
            resize: vertical;
            min-height: 100px;
            max-height: 200px;
            transition: border-color 0.3s, box-shadow 0.3s;
            line-height: 1.6;
            outline: none;
        }

        .input-area textarea:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
        }

        .input-area textarea::placeholder {
            color: #555;
        }

        .input-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .input-actions button {
            background: #28283a;
            border: 1px solid #3a3a4e;
            border-radius: 40px;
            padding: 10px 22px;
            color: #eee;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, border-color 0.2s;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
            flex: 1 1 auto;
            justify-content: center;
        }

        .input-actions button:hover {
            background: #3a3a52;
            border-color: #5a5a7a;
        }

        .input-actions button:active {
            transform: scale(0.96);
        }

        .input-actions .btn-play {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: #fff;
        }

        .input-actions .btn-play:hover {
            background: #7c6df0;
            border-color: #7c6df0;
        }

        .input-actions .btn-play:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .input-actions .btn-reset {
            background: transparent;
            border-color: #2a2a3a;
            color: #888;
        }

        .input-actions .btn-reset:hover {
            background: #1a1a2a;
            border-color: #4a4a5a;
            color: #ccc;
        }

        .input-actions .btn-speed {
            background: transparent;
            border-color: #2a2a3a;
            color: #888;
            font-size: 12px;
            padding: 10px 14px;
        }

        .input-actions .btn-speed:hover {
            background: #1a1a2a;
            border-color: #4a4a5a;
            color: #ccc;
        }

        /* ── Cinema Screen (the "motion div") ── */
        .cinema-screen {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #060608;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 20px 60px rgba(0, 0, 0, 0.7);
            min-height: 320px;
        }

        /* ── Animated background orbs ── */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
            animation: orbFloat 14s ease-in-out infinite alternate;
        }
        .bg-orb-1 {
            width: 350px;
            height: 350px;
            background: #6c2bd9;
            top: -120px;
            left: -80px;
            animation-delay: 0s;
        }
        .bg-orb-2 {
            width: 300px;
            height: 300px;
            background: #d94b8c;
            bottom: -120px;
            right: -80px;
            animation-delay: 5s;
        }
        .bg-orb-3 {
            width: 180px;
            height: 180px;
            background: #2b9bd9;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
            opacity: 0.2;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, 20px) scale(1.3);
            }
        }

        /* ── Screen content (scrolling container) ── */
        .screen-content {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
            padding: 40px clamp(16px, 5vw, 50px);
            /* 👈 50px margin around text on large screens, scales on mobile */
        }

        /* ── Individual line ── */
        .line-item {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: clamp(20px, 4.5vw, 46px);
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.3;
            padding: 4px 10px;
            border-radius: 6px;
            text-shadow: 0 2px 40px rgba(0, 0, 0, 0.7);
            white-space: nowrap;
            pointer-events: none;
            will-change: transform, opacity;
            width: auto;
            max-width: 90%;
            opacity: 0;
            transition: none;
        }

        .line-item.empty-line {
            opacity: 0.12 !important;
            font-size: 0.8em;
            color: #555 !important;
            text-shadow: none !important;
        }

        /* ── Empty state ── */
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #444;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            z-index: 5;
            pointer-events: none;
            gap: 8px;
            transition: opacity 0.6s;
            padding: 20px;
            text-align: center;
        }

        .empty-state .icon {
            font-size: 42px;
            opacity: 0.3;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 13px;
            opacity: 0.5;
            max-width: 280px;
        }

        .empty-state.hidden {
            opacity: 0;
        }

        /* ── Film grain ── */
        .film-grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        /* ── Status bar ── */
        .status-bar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            color: rgba(255, 255, 255, 0.12);
            font-family: 'Segoe UI', sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: opacity 0.6s;
            white-space: nowrap;
        }

        .status-bar.hidden {
            opacity: 0;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1a2a;
            color: #eee;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #3a3a4e;
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
            z-index: 999;
            font-family: 'Segoe UI', sans-serif;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Responsive (Mobile First) ── */
        @media (max-width: 700px) {
            .app {
                padding: 18px 16px;
            }
            .cinema-screen {
                aspect-ratio: 4 / 3;
                min-height: 260px;
                border-radius: 16px;
            }
            .screen-content {
                padding: 30px clamp(14px, 4vw, 30px);
            }
            .line-item {
                font-size: clamp(18px, 4.5vw, 28px);
                max-width: 92%;
                padding: 3px 8px;
            }
            .input-actions button {
                padding: 8px 16px;
                font-size: 12px;
            }
            .badge {
                font-size: 9px;
            }
            .header h1 {
                font-size: 16px;
            }
            .bg-orb-1 {
                width: 220px;
                height: 220px;
                top: -80px;
                left: -60px;
            }
            .bg-orb-2 {
                width: 180px;
                height: 180px;
                bottom: -80px;
                right: -60px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .app {
                padding: 14px 12px;
                border-radius: 24px;
            }
            .cinema-screen {
                aspect-ratio: 1 / 1;
                min-height: 220px;
                border-radius: 14px;
            }
            .screen-content {
                padding: 30px clamp(12px, 3.5vw, 20px);
            }
            .line-item {
                font-size: clamp(15px, 4.5vw, 22px);
                max-width: 94%;
                padding: 2px 6px;
            }
            .input-area textarea {
                font-size: 13px;
                padding: 12px 14px;
                min-height: 80px;
            }
            .input-actions {
                gap: 8px;
            }
            .input-actions button {
                padding: 8px 12px;
                font-size: 11px;
                flex: 1 1 40%;
            }
            .empty-state .icon {
                font-size: 32px;
            }
            .empty-state p {
                font-size: 12px;
            }
            .status-bar {
                font-size: 8px;
                padding: 2px 10px;
                bottom: 6px;
				display: none;
				
            }
            .header h1 {
                font-size: 15px;
            }
            .badge {
                font-size: 8px;
                padding: 3px 10px;
            }
            .bg-orb-1 {
                width: 150px;
                height: 150px;
                top: -50px;
                left: -40px;
            }
            .bg-orb-2 {
                width: 120px;
                height: 120px;
                bottom: -50px;
                right: -40px;
            }
            .bg-orb-3 {
                width: 100px;
                height: 100px;
            }
            .toast {
                font-size: 11px;
                padding: 6px 16px;
                bottom: 16px;
            }
        }

        @media (max-width: 380px) {
            .app {
                padding: 10px 8px;
            }
            .screen-content {
                padding: 20px clamp(8px, 2vw, 12px);
            }
            .line-item {
                font-size: clamp(13px, 4vw, 18px);
                max-width: 96%;
            }
            .input-actions button {
                font-size: 10px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- Header -->
        <div class="header">
            <h1>✦ <span>StoryCast</span></h1>
            <span class="badge">responsive · film credits</span>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <textarea id="textInput" placeholder="Paste your story here…&#10;Lines scroll upward with fixed spacing." rows="5">I thought my love for her was
a while(true) loop.
I forgot that
even the strongest loops...
can face
a break; statement
if they consume
too much memory.</textarea>
            <div class="input-actions">
                <button class="btn-speed" id="speedBtn" data-speed="1">Speed 1×</button>
                <button class="btn-reset" id="resetBtn">↺ Clear</button>
                <button class="btn-play" id="playBtn">▶ Play Credits</button>
            </div>
        </div>

        <!-- Cinema Screen (Motion Div) -->
        <div class="cinema-screen" id="cinemaScreen">
            <!-- Background Orbs -->
            <div class="bg-orb bg-orb-1"></div>
            <div class="bg-orb bg-orb-2"></div>
            <div class="bg-orb bg-orb-3"></div>

            <!-- Film Grain -->
            <div class="film-grain"></div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="icon">🎬</div>
                <p>Enter your story &amp; hit "Play Credits"</p>
            </div>

            <!-- Screen Content -->
            <div class="screen-content" id="screenContent"></div>

            <!-- Status Bar -->
            <div class="status-bar" id="statusBar">● ready</div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const textInput = document.getElementById('textInput');
            const playBtn = document.getElementById('playBtn');
            const resetBtn = document.getElementById('resetBtn');
            const speedBtn = document.getElementById('speedBtn');
            const screenContent = document.getElementById('screenContent');
            const emptyState = document.getElementById('emptyState');
            const statusBar = document.getElementById('statusBar');
            const toast = document.getElementById('toast');

            let toastTimer = null;
            let isPlaying = false;
            let animationId = null;
            let speedMultiplier = 1;
            const speedOptions = [0.5, 1, 1.5, 2];

            // ── Fixed spacing between lines ──
            const LINE_SPACING = 75;

            // ── Beautiful color palette ──
            const palette = [
                '#FF6B6B', '#FF9F43', '#FECA57', '#48DBFB', '#FF9FF3',
                '#54A0FF', '#5F27CD', '#00D2D3', '#A29BFE', '#FD79A8',
                '#FDCB6E', '#00CEC9', '#6C5CE7', '#E17055', '#00B894',
                '#F368E0', '#4BC0C0', '#FFC048', '#FF6B81', '#7C5CFC'
            ];

            // ── Toast helper ──
            function showToast(message, duration = 2200) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toast.classList.remove('show');
                }
                void toast.offsetWidth;
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, duration);
            }

            // ── Get lines from input ──
            function getLines() {
                const raw = textInput.value;
                if (!raw || raw.trim().length === 0) return [];
                return raw.split('\n');
            }

            // ── Reset / Clear ──
            function resetScreen(keepText = false) {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                isPlaying = false;
                playBtn.textContent = '▶ Play Credits';
                playBtn.disabled = false;
                screenContent.innerHTML = '';
                emptyState.classList.remove('hidden');
                statusBar.textContent = '● ready';
                statusBar.classList.remove('hidden');
                if (!keepText) {
                    textInput.value = '';
                }
            }

            // ── Speed toggle ──
            function cycleSpeed() {
                const currentIdx = speedOptions.indexOf(speedMultiplier);
                const nextIdx = (currentIdx + 1) % speedOptions.length;
                speedMultiplier = speedOptions[nextIdx];
                speedBtn.textContent = `Speed ${speedMultiplier}×`;
                if (isPlaying) {
                    showToast(`Speed: ${speedMultiplier}×`, 1200);
                }
            }

            // ── Play the credits ──
            function playCredits() {
                const lines = getLines();
                if (lines.length === 0) {
                    showToast('Please enter some text first.', 2000);
                    return;
                }

                const hasContent = lines.some(l => l.trim().length > 0);
                if (!hasContent) {
                    showToast('Please enter some text.', 2000);
                    return;
                }

                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                screenContent.innerHTML = '';
                emptyState.classList.add('hidden');
                isPlaying = true;
                playBtn.textContent = '⏳ Playing...';
                playBtn.disabled = true;
                statusBar.textContent = '● playing';

                const container = screenContent;
                const containerHeight = container.clientHeight || 600;

                const baseSpeed = 0.8;
                const speed = baseSpeed * speedMultiplier;
                const fadeZone = 70;

                let activeLines = [];
                let lineIndex = 0;
                let lastFrameTime = 0;

                // ── Create a line element ──
                function createLineElement(text, index) {
                    const div = document.createElement('div');
                    div.className = 'line-item';

                    const isEmpty = text.trim() === '' && text === '';
                    if (isEmpty) {
                        div.textContent = '\u00A0';
                        div.classList.add('empty-line');
                    } else {
                        div.textContent = text;
                        const colorIdx = index % palette.length;
                        const color = palette[colorIdx];
                        div.style.color = color;
                        div.style.textShadow =
                            `0 0 60px ${color}33, 0 0 120px ${color}11, 0 2px 30px rgba(0,0,0,0.6)`;
                    }

                    div.style.top = containerHeight + 'px';
                    div.style.opacity = '0';
                    container.appendChild(div);
                    return div;
                }

                // ── Spawn a new line ──
                function spawnLine() {
                    if (lineIndex >= lines.length) return;
                    const text = lines[lineIndex];
                    const el = createLineElement(text, lineIndex);
                    const lineData = {
                        element: el,
                        y: containerHeight,
                        text: text,
                        index: lineIndex,
                        isEmpty: text.trim() === '' && text === ''
                    };
                    activeLines.push(lineData);
                    lineIndex++;
                }

                // Spawn the first line immediately
                spawnLine();

                // ── Animation loop ──
                function animate(timestamp) {
                    if (!isPlaying) {
                        return;
                    }

                    if (lastFrameTime === 0) lastFrameTime = timestamp;
                    const delta = Math.min((timestamp - lastFrameTime) / 16, 3);
                    lastFrameTime = timestamp;

                    const moveDistance = speed * delta;

                    // Move all lines up
                    const toRemove = [];
                    for (let i = activeLines.length - 1; i >= 0; i--) {
                        const line = activeLines[i];
                        line.y -= moveDistance;

                        const el = line.element;
                        const top = line.y;

                        // Fade in/out
                        const bottomFade = Math.min(1, (containerHeight - top) / fadeZone);
                        const topFade = Math.min(1, (top + 30) / fadeZone);
                        let opacity = Math.min(bottomFade, topFade);
                        opacity = Math.max(0, Math.min(1, opacity));

                        if (line.isEmpty) {
                            opacity = Math.min(opacity, 0.12);
                        }

                        el.style.top = top + 'px';
                        el.style.opacity = opacity;

                        if (top < -60) {
                            toRemove.push(i);
                        }
                    }

                    for (const idx of toRemove) {
                        const line = activeLines[idx];
                        if (line.element.parentNode) {
                            line.element.remove();
                        }
                        activeLines.splice(idx, 1);
                    }

                    // ── Maintain fixed spacing ──
                    if (lineIndex < lines.length) {
                        const lastLine = activeLines.length > 0 ? activeLines[activeLines.length - 1] : null;
                        const lastY = lastLine ? lastLine.y : containerHeight + 100;

                        if (lastY < containerHeight - LINE_SPACING) {
                            spawnLine();
                        }
                    }

                    // Check completion
                    const allSpawned = lineIndex >= lines.length;
                    const noLinesLeft = activeLines.length === 0;

                    if (allSpawned && noLinesLeft) {
                        isPlaying = false;
                        playBtn.textContent = '↻ Replay';
                        playBtn.disabled = false;
                        statusBar.textContent = '● complete';
                        showToast('🎬 Credits finished!', 2000);
                        return;
                    }

                    if (activeLines.length > 0) {
                        statusBar.textContent = `● ${activeLines.length} lines · ${lineIndex}/${lines.length}`;
                    }

                    animationId = requestAnimationFrame(animate);
                }

                lastFrameTime = 0;
                animationId = requestAnimationFrame(animate);
            }

            // ── Event Listeners ──
            playBtn.addEventListener('click', () => {
                if (isPlaying) {
                    resetScreen(true);
                    setTimeout(() => playCredits(), 200);
                } else {
                    playCredits();
                }
            });

            resetBtn.addEventListener('click', () => {
                resetScreen(false);
                showToast('Cleared', 1200);
            });

            speedBtn.addEventListener('click', cycleSpeed);

            textInput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    if (isPlaying) {
                        resetScreen(true);
                        setTimeout(() => playCredits(), 200);
                    } else {
                        playCredits();
                    }
                }
            });

            // ── Init ──
            resetScreen(true);

            // Handle resize to update container dimensions
            const resizeObserver = new ResizeObserver(() => {});
            resizeObserver.observe(document.getElementById('cinemaScreen'));

            console.log('🎬 StoryCast ready! Fixed margin: 75px. Fully responsive.');
        })();
    </script>

</body>
</html>
